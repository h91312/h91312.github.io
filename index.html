<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深圳展览速览</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1220;color:#e8eaf2;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{max-width:680px;padding:48px 40px;text-align:center}
  h1{font-size:30px;margin:0 0 12px;letter-spacing:1px}
  .sub{color:#8b90a8;font-size:15px;line-height:1.8;margin-bottom:28px}
  .tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
  .tag{background:#1c2138;border:1px solid #2c3358;color:#aab2d8;padding:6px 14px;border-radius:999px;font-size:13px}
  a.btn{display:inline-block;background:#5b6cff;color:#fff;text-decoration:none;padding:12px 26px;border-radius:10px;font-size:15px}
  footer{margin-top:34px;color:#5c6280;font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <h1>深圳展览速览</h1>
    <p class="sub">一个汇聚深圳地区美术馆、艺术机构展览信息（展名 / 艺术家 / 展期 / 场馆 / 票价）的本地看板工具，方便市民安排观展行程。</p>
    <div class="tags">
      <span class="tag">关山月美术馆</span>
      <span class="tag">OCAT</span>
      <span class="tag">海上世界文化艺术中心</span>
      <span class="tag">何香凝美术馆</span>
      <span class="tag">坪山美术馆</span>
      <span class="tag">设计互联</span>
    </div>
    <a class="btn" href="https://github.com/" target="_blank" rel="noopener">项目主页</a>
    <footer>本页面为应用访问地址示例，数据来源含深圳市政府开放数据平台等公开渠道，仅供个人非商业使用。</footer>
  </div>
</body>
</html>
